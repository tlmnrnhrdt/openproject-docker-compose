networks:
  frontend:
  backend:
  traefik:
    external: true

volumes:
  pgdata:
  opdata:

x-op-restart-policy: &restart_policy
  restart: unless-stopped
x-op-image: &image
  image: openproject/openproject:${TAG:-16-slim}
x-op-app: &app
  <<: [*image, *restart_policy]
  environment:
    OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-localhost:8080}"
    OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-true}"
    RAILS_CACHE_STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}"
    DATABASE_URL: "${DATABASE_URL:-postgres://postgres:p4ssw0rd@db/openproject?pool=20&encoding=unicode&reconnect=true}"
    RAILS_MIN_THREADS: ${RAILS_MIN_THREADS:-4}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
    # set to true to enable the email receiving feature. See ./docker/cron for more options
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
    # SMTP configuration for sending emails
    EMAIL_DELIVERY_METHOD: "smtp"
    SMTP_ADDRESS: "172.20.0.1"
    SMTP_PORT: "25"
    SMTP_DOMAIN: "new-amsterdam.reinh4rdt.com"
    SMTP_AUTHENTICATION: "none"
  volumes:
    - "${OPDATA:-opdata}:/var/openproject/assets"
    - "./timesheet-standard.yml:/app/app/models/work_package/pdf_export/export/timesheet/standard.yml"
    - "./timesheet_generator.rb:/app/modules/reporting/app/workers/cost_query/pdf/timesheet_generator.rb"

services:
  db:
    image: postgres:13
    <<: *restart_policy
    stop_grace_period: "3s"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
      - /run/postgresql:size=16m
    volumes:
      - "${PGDATA:-pgdata}:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p4ssw0rd}
      POSTGRES_DB: openproject
    networks:
      - backend
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    image: memcached
    <<: *restart_policy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11211; printf \"stats\\r\\nquit\\r\\n\" >&3; timeout 2 cat <&3 | grep -q pid'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    build:
      context: ./proxy
      args:
        APP_HOST: web
    image: openproject/proxy
    <<: *restart_policy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    # ports: # Removed - Traefik will handle external ports
    #   - "${PORT:-8080}:80"
    depends_on:
      - web
    networks:
      - frontend
      - traefik
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 64M
    labels:
      - "traefik.enable=true"  # Always enabled - will get higher priority when running
      - "traefik.http.routers.openproject.rule=Host(`openproject.new-amsterdam.reinh4rdt.com`)"
      - "traefik.http.routers.openproject.entrypoints=websecure"
      - "traefik.http.routers.openproject.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openproject.priority=10"
      - "traefik.http.routers.openproject.middlewares=openproject-headers"
      - "traefik.http.services.openproject.loadbalancer.server.port=80"
      - "traefik.http.middlewares.openproject-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.openproject-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.openproject-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.openproject-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.openproject-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.openproject-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.openproject-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  web:
    <<: *app
    command: "./docker/prod/web"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - frontend
      - backend
    depends_on:
      - db
      - cache
      - seeder
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}/health_checks/default"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

  autoheal:
    image: willfarrell/autoheal:1.2.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 600
      AUTOHEAL_INTERVAL: 30
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 32
        reservations:
          cpus: "0.1"
          memory: 32M

  worker:
    <<: *app
    command: "./docker/prod/worker"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - backend
    depends_on:
      - db
      - cache
      - seeder
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M

  cron:
    <<: *app
    command: "./docker/prod/cron"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - backend
    depends_on:
      - db
      - cache
      - seeder
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 128M

  seeder:
    <<: *app
    command: "./docker/prod/seeder"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
